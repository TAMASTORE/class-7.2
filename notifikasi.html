<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifikasi - Kelas 7.2</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

<!-- Flag Wave -->
<div class="flag-wave"></div>

<!-- Sidebar -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>🔔 Notifikasi</h2>
    <button class="sidebar-close" onclick="closeSidebar()">
      <i class="fas fa-times"></i>
    </button>
  </div>
  <ul class="sidebar-nav">
    <li><a data-page="notifikasi" onclick="navigateTo('notifikasi')"><i class="fas fa-bell"></i> Notifikasi</a></li>
  </ul>
  <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
    <a href="/index.html" style="color: #b0b0b0; font-size: 0.8rem; display: flex; align-items: center; gap: 8px; text-decoration: none;">
      <i class="fas fa-arrow-left"></i> Kembali ke Beranda
    </a>
  </div>
</nav>

<!-- Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Navbar -->
<nav class="navbar">
  <div class="navbar-left">
    <button class="menu-toggle" onclick="toggleSidebar()">
      <i class="fas fa-bars"></i>
    </button>
    <span class="font-bold">🔔 Notifikasi</span>
  </div>
  <div class="navbar-right" id="navbarRight">
    <button class="btn-login" id="loginBtn" onclick="handleLogin()">
      <i class="fas fa-sign-in-alt"></i> Login
    </button>
  </div>
</nav>

<!-- Main Content -->
<main class="main-content">
  <section class="page-section active" id="page-notifikasi">
    <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
      <i class="fas fa-bell text-red-600"></i> Notifikasi
      <span id="notifCount" class="text-sm bg-red-600 text-white px-3 py-1 rounded-full">0</span>
    </h2>
    
    <div id="notifikasiList" class="space-y-3">
      <p class="text-gray-400">Belum ada notifikasi</p>
    </div>
  </section>
</main>

<!-- Toast -->
<div id="toastContainer"></div>

<script type="module">
import { 
  auth, database, ref, onValue, get, update,
  signInWithPopup, googleProvider, onAuthStateChanged, signOut
} from './firebase-config.js';

let currentUser = null;
let userName = 'Tamu';

// ============ AUTH ============
window.handleLogin = function() {
  if (currentUser) {
    signOut(auth);
    currentUser = null;
    userName = 'Tamu';
    updateUI();
    toast('Logout berhasil', 'info');
  } else {
    loginWithGoogle();
  }
};

async function loginWithGoogle() {
  try {
    const result = await signInWithPopup(auth, googleProvider);
    currentUser = result.user;
    userName = currentUser.displayName || currentUser.email || 'User';
    
    const siswaRef = ref(database, 'siswa');
    const snap = await get(siswaRef);
    if (snap.exists()) {
      const data = snap.val();
      for (const uid in data) {
        if (uid === currentUser.uid && data[uid].status === 'siswa') {
          userName = data[uid].nama || userName;
          break;
        }
      }
    }
    
    updateUI();
    loadNotifikasi();
    toast(`✅ Login sebagai ${userName}`, 'success');
  } catch (error) {
    toast('Login gagal: ' + error.message, 'error');
  }
}

function updateUI() {
  const btn = document.getElementById('loginBtn');
  if (currentUser) {
    btn.innerHTML = `<img src="${currentUser.photoURL || 'https://ui-avatars.com/api/?name='+userName}" class="user-avatar" />`;
    btn.className = 'btn-login logged-in';
  } else {
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
    btn.className = 'btn-login';
  }
}

// ============ NOTIFIKASI ============
function loadNotifikasi() {
  const container = document.getElementById('notifikasiList');
  const countEl = document.getElementById('notifCount');
  const notifRef = ref(database, 'notifikasi');
  
  onValue(notifRef, (snap) => {
    if (!snap.exists()) {
      container.innerHTML = '<p class="text-gray-400">Belum ada notifikasi</p>';
      countEl.textContent = '0';
      return;
    }
    
    const data = snap.val();
    let html = '';
    let unreadCount = 0;
    const notifArray = Object.entries(data).sort((a, b) => new Date(b[1].waktu) - new Date(a[1].waktu));
    
    notifArray.forEach(([key, notif]) => {
      if (notif.target === 'global') {
        // tampilkan ke semua
      } else if (notif.target === 'personal') {
        if (notif.targetNama && notif.targetNama !== userName) return;
      } else {
        return;
      }
      
      if (!notif.dibaca) unreadCount++;
      const isKas = notif.tipe === 'kas';
      html += `
        <div class="bg-white p-4 rounded-xl border ${notif.dibaca ? 'border-gray-200' : 'border-red-300 bg-red-50'} shadow-sm hover:shadow-md transition">
          <div class="flex justify-between items-start">
            <div class="flex-1">
              <div class="flex items-center gap-2">
                ${notif.dibaca ? '' : '<span class="w-2 h-2 bg-red-600 rounded-full inline-block"></span>'}
                <p class="font-semibold text-sm">${notif.pengirim || 'Sistem'}</p>
                ${isKas ? '<span class="text-xs bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded-full">💰 Kas</span>' : ''}
              </div>
              <p class="text-gray-700 mt-1">${notif.pesan}</p>
              <span class="text-xs text-gray-400 mt-1 block">${notif.waktu ? new Date(notif.waktu).toLocaleString() : ''}</span>
            </div>
            ${!notif.dibaca ? `<button onclick="markAsRead('${key}')" class="text-xs text-blue-500 hover:text-blue-700">Tandai dibaca</button>` : ''}
          </div>
        </div>
      `;
    });
    
    container.innerHTML = html || '<p class="text-gray-400">Tidak ada notifikasi untuk Anda</p>';
    countEl.textContent = unreadCount;
  });
}

window.markAsRead = async function(key) {
  await update(ref(database, 'notifikasi/' + key), { dibaca: true });
  toast('✅ Ditandai dibaca', 'info');
};

// ============ SIDEBAR ============
window.toggleSidebar = function() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('active');
};

window.closeSidebar = function() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('active');
};

window.navigateTo = function(page) {
  document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  closeSidebar();
};

document.getElementById('sidebarOverlay')?.addEventListener('click', closeSidebar);

// ============ TOAST ============
function toast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(20px)';
    setTimeout(() => toast.remove(), 400);
  }, 3000);
}

// ============ AUTH STATE ============
onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (user) {
    userName = user.displayName || user.email || 'User';
    const siswaRef = ref(database, 'siswa');
    const snap = await get(siswaRef);
    if (snap.exists()) {
      const data = snap.val();
      for (const uid in data) {
        if (uid === user.uid && data[uid].status === 'siswa') {
          userName = data[uid].nama || userName;
          break;
        }
      }
    }
    updateUI();
    loadNotifikasi();
  } else {
    updateUI();
    loadNotifikasi();
  }
});

// ============ INIT ============
loadNotifikasi();

const bypassUID = localStorage.getItem('bypassUID');
const bypassNama = localStorage.getItem('bypassNama');
if (bypassUID && bypassNama) {
  userName = bypassNama;
  currentUser = { uid: bypassUID, displayName: bypassNama };
  updateUI();
  loadNotifikasi();
  toast(`👤 Login sebagai ${bypassNama} (Bypass)`, 'info');
}

window.toast = toast;
window.markAsRead = markAsRead;
window.handleLogin = handleLogin;

console.log('🔔 Notifikasi Kelas 7.2 siap!');
</script>

</body>
</html>
