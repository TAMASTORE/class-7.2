<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat - Kelas 7.2</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    .chat-container {
      height: calc(100vh - 260px);
      overflow-y: auto;
      padding: 16px;
      background: #f8f9fa;
      border-radius: 16px;
      border: 1px solid #e9ecef;
    }
    .chat-msg {
      max-width: 75%;
      margin-bottom: 12px;
      padding: 10px 16px;
      border-radius: 16px;
      word-wrap: break-word;
      animation: fadeSlide 0.3s ease;
    }
    .chat-msg.self {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }
    .chat-msg.other {
      background: white;
      color: #2c3e50;
      border: 1px solid #e9ecef;
      border-bottom-left-radius: 4px;
    }
    .chat-msg .sender {
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .chat-msg .time {
      font-size: 0.6rem;
      opacity: 0.6;
      margin-top: 4px;
      display: block;
    }
    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
      padding: 8px;
    }
    .sticker-grid img, .sticker-grid div {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: contain;
      cursor: pointer;
      border-radius: 8px;
      transition: 0.3s;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    .sticker-grid img:hover, .sticker-grid div:hover {
      transform: scale(1.1);
    }
    .chat-input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: white;
      border-radius: 16px;
      border: 1px solid #e9ecef;
      margin-top: 12px;
      align-items: center;
    }
    .chat-input-area input {
      flex: 1;
      border: none;
      outline: none;
      padding: 8px 0;
      font-size: 0.95rem;
    }
    .chat-mode-selector {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .chat-mode-btn {
      padding: 8px 20px;
      border-radius: 30px;
      border: 2px solid #e9ecef;
      background: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }
    .chat-mode-btn.active {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }
    .chat-mode-btn:hover {
      border-color: #e74c3c;
    }
  </style>
</head>
<body>

<!-- Flag Wave -->
<div class="flag-wave"></div>

<!-- Sidebar -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>💬 Chat Kelas 7.2</h2>
    <button class="sidebar-close" onclick="closeSidebar()">
      <i class="fas fa-times"></i>
    </button>
  </div>
  <ul class="sidebar-nav">
    <li><a data-page="chat" onclick="navigateTo('chat')"><i class="fas fa-comment-dots"></i> Chat</a></li>
    <li><a data-page="status" onclick="navigateTo('status')"><i class="fas fa-circle"></i> Status</a></li>
    <li><a data-page="stiker" onclick="navigateTo('stiker')"><i class="fas fa-sticky-note"></i> Stiker</a></li>
  </ul>
  <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
    <a href="/index.html" style="color: #b0b0b0; font-size: 0.8rem; display: flex; align-items: center; gap: 8px; text-decoration: none;">
      <i class="fas fa-arrow-left"></i> Kembali ke Beranda
    </a>
  </div>
</nav>

<!-- Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Navbar -->
<nav class="navbar">
  <div class="navbar-left">
    <button class="menu-toggle" onclick="toggleSidebar()">
      <i class="fas fa-bars"></i>
    </button>
    <span class="font-bold">💬 Chat</span>
  </div>
  <div class="navbar-right" id="navbarRight">
    <button class="btn-login" id="loginBtn" onclick="handleLogin()">
      <i class="fas fa-sign-in-alt"></i> Login
    </button>
  </div>
</nav>

<!-- Main Content -->
<main class="main-content">

  <!-- Chat Section -->
  <section class="page-section active" id="page-chat">
    <h2 class="text-2xl font-bold mb-4">💬 Ruang Chat</h2>
    
    <div class="chat-mode-selector">
      <button class="chat-mode-btn active" data-mode="grup" onclick="switchMode('grup')">
        <i class="fas fa-users"></i> Grup Kelas
      </button>
      <button class="chat-mode-btn" data-mode="private" onclick="switchMode('private')">
        <i class="fas fa-user"></i> Private Chat
      </button>
    </div>
    
    <div id="privateSelector" style="display:none;" class="mb-4">
      <select id="privateTarget" class="w-full px-4 py-2 border rounded-xl">
        <option value="">Pilih teman untuk chat private...</option>
      </select>
    </div>
    
    <div class="chat-container" id="chatContainer">
      <div id="chatMessages">
        <p class="text-gray-400 text-center">💬 Mulai percakapan...</p>
      </div>
    </div>
    
    <div class="chat-input-area">
      <button onclick="toggleStiker()" class="text-2xl hover:text-red-600 transition">
        <i class="fas fa-smile"></i>
      </button>
      <input type="text" id="chatInput" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter') sendMessage()" />
      <button onclick="sendMessage()" class="px-4 py-2 bg-red-600 text-white rounded-xl font-semibold hover:bg-red-700 transition">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
    
    <div id="stickerPanel" style="display:none;" class="bg-white rounded-2xl shadow-lg border border-gray-200 mt-4 p-4">
      <div class="flex justify-between items-center mb-2">
        <h4 class="font-bold text-sm">🎨 Stiker</h4>
        <button onclick="toggleStiker()" class="text-gray-400 hover:text-red-600">&times;</button>
      </div>
      <div class="sticker-grid" id="stickerGrid"></div>
      <div class="mt-3 flex gap-2">
        <input type="text" id="stickerUrlInput" placeholder="URL gambar/video stiker..." class="flex-1 px-3 py-1 border rounded-lg text-sm" />
        <button onclick="addSticker()" class="px-3 py-1 bg-green-500 text-white rounded-lg text-sm hover:bg-green-600">Tambah</button>
      </div>
    </div>
  </section>

  <!-- Status Section -->
  <section class="page-section" id="page-status">
    <h2 class="text-2xl font-bold mb-4">📢 Status Kelas</h2>
    
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6">
      <h4 class="font-semibold mb-3">Bagikan Status</h4>
      <div class="space-y-3">
        <textarea id="statusInput" rows="2" class="w-full px-4 py-2 border rounded-xl" placeholder="Tulis status..."></textarea>
        <div class="flex gap-3 flex-wrap">
          <input type="text" id="statusGambar" placeholder="Link gambar (opsional)" class="flex-1 px-4 py-2 border rounded-xl text-sm min-w-[150px]" />
          <input type="text" id="statusVideo" placeholder="Link video (opsional)" class="flex-1 px-4 py-2 border rounded-xl text-sm min-w-[150px]" />
          <button onclick="bagikanStatus()" class="px-6 py-2 bg-red-600 text-white rounded-xl font-semibold hover:bg-red-700 transition">
            <i class="fas fa-share-alt"></i> Bagikan
          </button>
        </div>
      </div>
    </div>
    
    <div id="statusFeed" class="space-y-4">
      <p class="text-gray-400">Belum ada status</p>
    </div>
  </section>

  <!-- Stiker Section -->
  <section class="page-section" id="page-stiker">
    <h2 class="text-2xl font-bold mb-4">🎨 Koleksi Stiker</h2>
    <div class="sticker-grid" id="stickerCollection" style="grid-template-columns: repeat(8, 1fr);"></div>
  </section>

</main>

<!-- Toast -->
<div id="toastContainer"></div>

<script type="module">
import { 
  auth, database, ref, set, push, onValue, get, update,
  signInWithPopup, googleProvider, onAuthStateChanged, signOut
} from './firebase-config.js';

// ============ DATA ============
const siswaData = [
  { no: '01', nama: 'ABDILLAH AKIRA SYADID' },
  { no: '02', nama: 'ABDUL LATIF' },
  { no: '03', nama: 'ACHMAD ADELARD BILFAQIH' },
  { no: '04', nama: 'ACHMAD IKHSAN' },
  { no: '05', nama: 'ADLIYA DZAHBIAH AZZALEA' },
  { no: '06', nama: 'AHMAD HAIKAL DZUHRI' },
  { no: '07', nama: 'ALEEFA LABITSA BILQIS' },
  { no: '08', nama: 'ANANDA BAHARUDDIN' },
  { no: '09', nama: 'ANI NAURA IZZATI BACHTIAR' },
  { no: '10', nama: 'ARZKY WIRAPUTRA PERMANA' },
  { no: '11', nama: 'ASYADDA TRIPUTRA CLEAREST' },
  { no: '12', nama: 'AUFA RIZAL RAIS' },
  { no: '13', nama: 'DENY FIRMANSYAH' },
  { no: '14', nama: 'DEVI FADHILAH K' },
  { no: '15', nama: 'DIO ARSYAVIN' },
  { no: '16', nama: 'FAQIH SETO ASNAWI' },
  { no: '17', nama: 'FIKKA DEAN SYABAN' },
  { no: '18', nama: 'KAFI ALHABSY' },
  { no: '19', nama: 'MEDINA FATHIYAH HANUM MARZUKI' },
  { no: '20', nama: 'MUHAMMAD IHSAN DANISHWAR' },
  { no: '21', nama: 'MUHAMMAD NAFUAL SHIDIQI' },
  { no: '22', nama: 'RAZIQ SHIDIQI AL MANOVI' },
  { no: '23', nama: 'RENAI SISTHA' },
  { no: '24', nama: 'SEKAR NUR HASANAH' },
  { no: '25', nama: 'SYAKIRA LIONA' },
  { no: '26', nama: 'VANESHA DWI SAPITRI' },
  { no: '27', nama: 'YUSUF JAFAR SAPUTRA' },
  { no: '28', nama: 'BANYU ALPRIYAND' },
  { no: '29', nama: 'BISMA' }
];

const defaultStickers = ['😊','😂','🤣','❤️','🔥','💪','👋','🙌','😍','🥰','😘','😅','🤔','😭','🥺','😎','🤯','🥳','👀','🙏','💀','🫶','🤝','✨','🌟','💯','🎉','🎊','🏆','⭐','🌈','🎵','🎶','💎','🌹','🌸','🌺','🌻','🌼','🌷','🎂','🎁','🎈'];

let currentUser = null;
let currentMode = 'grup';
let currentChatKey = null;
let userName = 'Tamu';
let stickerToSend = null;

// ============ SIDEBAR ============
window.toggleSidebar = function() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('active');
};

window.closeSidebar = function() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('active');
};

window.navigateTo = function(page) {
  document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  closeSidebar();
};

document.getElementById('sidebarOverlay')?.addEventListener('click', closeSidebar);

// ============ TOAST ============
function toast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(20px)';
    setTimeout(() => toast.remove(), 400);
  }, 3000);
}

// ============ AUTH ============
window.handleLogin = function() {
  if (currentUser) {
    signOut(auth);
    currentUser = null;
    userName = 'Tamu';
    updateUI();
    toast('Logout berhasil', 'info');
  } else {
    loginWithGoogle();
  }
};

async function loginWithGoogle() {
  try {
    const result = await signInWithPopup(auth, googleProvider);
    currentUser = result.user;
    userName = currentUser.displayName || currentUser.email || 'User';
    
    const siswaRef = ref(database, 'siswa');
    const snap = await get(siswaRef);
    if (snap.exists()) {
      const data = snap.val();
      for (const uid in data) {
        if (uid === currentUser.uid && data[uid].status === 'siswa') {
          userName = data[uid].nama || userName;
          break;
        }
      }
    }
    
    updateUI();
    toast(`✅ Login sebagai ${userName}`, 'success');
    loadChat();
    loadStatus();
  } catch (error) {
    toast('Login gagal: ' + error.message, 'error');
  }
}

function updateUI() {
  const btn = document.getElementById('loginBtn');
  if (currentUser) {
    btn.innerHTML = `<img src="${currentUser.photoURL || 'https://ui-avatars.com/api/?name='+userName}" class="user-avatar" />`;
    btn.className = 'btn-login logged-in';
  } else {
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
    btn.className = 'btn-login';
  }
}

// ============ CHAT MODE ============
window.switchMode = function(mode) {
  currentMode = mode;
  document.querySelectorAll('.chat-mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
  document.getElementById('privateSelector').style.display = mode === 'private' ? 'block' : 'none';
  if (mode === 'private') loadPrivateTargets();
  loadChat();
};

function loadPrivateTargets() {
  const select = document.getElementById('privateTarget');
  select.innerHTML = '<option value="">Pilih teman...</option>';
  const currentNama = userName;
  siswaData.forEach(s => {
    if (s.nama !== currentNama) {
      const opt = document.createElement('option');
      opt.value = s.nama;
      opt.textContent = `${s.no} - ${s.nama}`;
      select.appendChild(opt);
    }
  });
  select.onchange = function() { loadChat(); };
}

// ============ CHAT ============
function loadChat() {
  const container = document.getElementById('chatMessages');
  if (!currentUser) {
    container.innerHTML = '<p class="text-gray-400 text-center">🔒 Login dulu untuk chat</p>';
    return;
  }
  
  let chatPath = 'chat/grup';
  if (currentMode === 'private') {
    const target = document.getElementById('privateTarget').value;
    if (!target) {
      container.innerHTML = '<p class="text-gray-400 text-center">👤 Pilih teman untuk chat private</p>';
      return;
    }
    const names = [userName, target].sort();
    currentChatKey = names.join('_');
    chatPath = `chat/private/${currentChatKey}`;
  } else {
    currentChatKey = 'grup';
    chatPath = 'chat/grup';
  }
  
  const chatRef = ref(database, chatPath);
  onValue(chatRef, (snap) => {
    if (!snap.exists()) {
      container.innerHTML = '<p class="text-gray-400 text-center">💬 Belum ada pesan. Mulai chat!</p>';
      return;
    }
    const data = snap.val();
    let html = '';
    let lastSender = '';
    for (const key in data) {
      const msg = data[key];
      const isSelf = msg.pengirim === userName || msg.uid === currentUser?.uid;
      const showSender = msg.pengirim !== lastSender;
      lastSender = msg.pengirim;
      html += `
        <div class="chat-msg ${isSelf ? 'self' : 'other'}">
          ${!isSelf && showSender ? `<div class="sender">${msg.pengirim || 'Anonim'}</div>` : ''}
          ${msg.stiker ? `<img src="${msg.stiker}" class="max-w-[150px] rounded-lg" />` : ''}
          ${msg.pesan ? `<div>${msg.pesan}</div>` : ''}
          <span class="time">${msg.waktu ? new Date(msg.waktu).toLocaleTimeString() : ''}</span>
        </div>
      `;
    }
    container.innerHTML = html;
    container.scrollTop = container.scrollHeight;
  });
}

window.sendMessage = function() {
  const input = document.getElementById('chatInput');
  const pesan = input.value.trim();
  if (!pesan && !stickerToSend) {
    toast('Isi pesan atau pilih stiker!', 'error');
    return;
  }
  if (!currentUser) {
    toast('Login dulu untuk chat!', 'error');
    return;
  }
  
  let chatPath = 'chat/grup';
  if (currentMode === 'private') {
    const target = document.getElementById('privateTarget').value;
    if (!target) {
      toast('Pilih teman untuk chat private!', 'error');
      return;
    }
    const names = [userName, target].sort();
    currentChatKey = names.join('_');
    chatPath = `chat/private/${currentChatKey}`;
  }
  
  const chatRef = push(ref(database, chatPath));
  set(chatRef, {
    pesan: pesan || '',
    stiker: stickerToSend || null,
    pengirim: userName,
    uid: currentUser.uid,
    waktu: new Date().toISOString()
  });
  
  input.value = '';
  stickerToSend = null;
  document.getElementById('stickerPanel').style.display = 'none';
};

// ============ STIKER ============
function renderStickers() {
  const grid = document.getElementById('stickerGrid');
  const collection = document.getElementById('stickerCollection');
  let html = '';
  defaultStickers.forEach(s => {
    if (s.length <= 2) {
      html += `<div onclick="selectSticker('${s}')" class="text-4xl cursor-pointer hover:scale-110 transition">${s}</div>`;
    } else {
      html += `<img src="${s}" onclick="selectSticker('${s}')" class="w-full aspect-square object-cover cursor-pointer hover:scale-110 transition rounded-lg" />`;
    }
  });
  grid.innerHTML = html;
  collection.innerHTML = html;
}

window.selectSticker = function(sticker) {
  stickerToSend = sticker;
  document.getElementById('stickerPanel').style.display = 'none';
  document.getElementById('chatInput').placeholder = 'Stiker dipilih! Klik kirim ➤';
  toast('✅ Stiker dipilih!', 'info');
};

window.toggleStiker = function() {
  const panel = document.getElementById('stickerPanel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
};

window.addSticker = function() {
  const input = document.getElementById('stickerUrlInput');
  const url = input.value.trim();
  if (!url) {
    toast('Masukkan URL stiker!', 'error');
    return;
  }
  defaultStickers.push(url);
  renderStickers();
  input.value = '';
  toast('✅ Stiker berhasil ditambahkan!', 'success');
};

// ============ STATUS ============
window.bagikanStatus = function() {
  const teks = document.getElementById('statusInput').value.trim();
  const gambar = document.getElementById('statusGambar').value.trim();
  const video = document.getElementById('statusVideo').value.trim();
  if (!teks && !gambar && !video) {
    toast('Isi teks atau tambahkan media!', 'error');
    return;
  }
  if (!currentUser) {
    toast('Login dulu untuk bagikan status!', 'error');
    return;
  }
  
  const statusRef = push(ref(database, 'status'));
  set(statusRef, {
    teks: teks,
    gambar: gambar || null,
    video: video || null,
    pengirim: userName,
    uid: currentUser.uid,
    waktu: new Date().toISOString()
  });
  
  document.getElementById('statusInput').value = '';
  document.getElementById('statusGambar').value = '';
  document.getElementById('statusVideo').value = '';
  toast('📢 Status berhasil dibagikan!', 'success');
};

function loadStatus() {
  const container = document.getElementById('statusFeed');
  const statusRef = ref(database, 'status');
  onValue(statusRef, (snap) => {
    if (!snap.exists()) {
      container.innerHTML = '<p class="text-gray-400">Belum ada status</p>';
      return;
    }
    const data = snap.val();
    let html = '';
    const statusArray = Object.values(data).sort((a, b) => new Date(b.waktu) - new Date(a.waktu));
    statusArray.forEach(s => {
      html += `
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <div class="flex justify-between items-start">
            <p class="font-bold">${s.pengirim || 'Anonim'}</p>
            <span class="text-xs text-gray-400">${s.waktu ? new Date(s.waktu).toLocaleString() : ''}</span>
          </div>
          ${s.teks ? `<p class="mt-1 text-gray-700">${s.teks}</p>` : ''}
          ${s.gambar ? `<img src="${s.gambar}" class="mt-2 max-h-48 rounded-lg object-cover" />` : ''}
          ${s.video ? `<video src="${s.video}" class="mt-2 max-h-48 rounded-lg" controls></video>` : ''}
        </div>
      `;
    });
    container.innerHTML = html;
  });
}

// ============ AUTH STATE ============
onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (user) {
    userName = user.displayName || user.email || 'User';
    const siswaRef = ref(database, 'siswa');
    const snap = await get(siswaRef);
    if (snap.exists()) {
      const data = snap.val();
      for (const uid in data) {
        if (uid === user.uid && data[uid].status === 'siswa') {
          userName = data[uid].nama || userName;
          break;
        }
      }
    }
    updateUI();
    loadChat();
    loadStatus();
  } else {
    updateUI();
  }
});

// ============ INIT ============
renderStickers();
loadStatus();

const bypassUID = localStorage.getItem('bypassUID');
const bypassNama = localStorage.getItem('bypassNama');
if (bypassUID && bypassNama) {
  userName = bypassNama;
  currentUser = { uid: bypassUID, displayName: bypassNama };
  updateUI();
  loadChat();
  loadStatus();
  toast(`👤 Login sebagai ${bypassNama} (Bypass)`, 'info');
}

window.toast = toast;
window.sendMessage = sendMessage;
window.bagikanStatus = bagikanStatus;
window.selectSticker = selectSticker;
window.toggleStiker = toggleStiker;
window.addSticker = addSticker;
window.switchMode = switchMode;
window.handleLogin = handleLogin;

console.log('💬 Chat Kelas 7.2 siap!');
</script>

</body>
</html>
